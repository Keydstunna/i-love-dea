<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Dea 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c0f1f;--bg2:#4a1838;--soft:#ffd1e3;--leaf:#5fa383;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 28%,var(--bg2),var(--bg) 72%);color:var(--soft);font-family:'Caveat',cursive;-webkit-tap-highlight-color:transparent;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}

/* hero photo */
.hero{--ps:clamp(140px,min(50vw,28vh),270px);position:fixed;left:50%;top:29%;width:var(--ps);height:var(--ps);margin:calc(var(--ps)/-2) 0 0 calc(var(--ps)/-2);z-index:1;perspective:700px}
.tilt{position:absolute;inset:0;transition:transform .25s ease-out}
.pop{position:absolute;inset:0;animation:pop 1.6s cubic-bezier(.2,1.2,.3,1) .3s both}
@keyframes pop{from{transform:scale(.2);opacity:0;filter:blur(14px)}to{transform:none;opacity:1;filter:none}}
.photo{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:linear-gradient(145deg,#ff9ec7,#c2185b);animation:glow 2.4s ease-in-out infinite alternate;cursor:pointer}
@keyframes glow{from{box-shadow:0 0 22px 2px rgba(255,92,154,.55),0 0 0 4px rgba(255,209,227,.7)}to{box-shadow:0 0 60px 12px rgba(255,92,154,.85),0 0 0 4px rgba(255,255,255,.9)}}
.photo .initial{position:absolute;inset:0;display:grid;place-items:center;font:italic 500 calc(var(--ps)*.5)/1 'Fraunces',serif;color:#fff}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 12s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.14) translate(-2%,-1%)}}
.photo::after{content:"";position:absolute;inset:-50%;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.55) 50%,transparent 58%);transform:translateX(-100%);animation:shine 5s ease-in-out 3s infinite}
@keyframes shine{0%{transform:translateX(-100%)}40%,100%{transform:translateX(100%)}}
.ring{position:absolute;inset:-6%;width:112%;height:112%;overflow:visible;pointer-events:none}
.ring circle{fill:none;stroke:url(#rg);stroke-width:1.1;stroke-dasharray:302;stroke-dashoffset:302;animation:draw 2.4s ease-out 1.1s forwards;filter:drop-shadow(0 0 3px #ff5c9a)}
.ring.dash{inset:-14%;width:128%;height:128%;animation:spin 40s linear infinite}
.ring.dash circle{stroke-dasharray:2 5;stroke-dashoffset:0;opacity:.6;animation:none}
@keyframes draw{to{stroke-dashoffset:0}}
.orbit{position:absolute;left:50%;top:50%;width:0;height:0;animation:spin var(--T) linear infinite}
.h{position:absolute;left:0;top:0;width:0;height:0;transform:rotate(var(--a)) translateY(calc(var(--r)*-1))}
.u{position:absolute;left:0;top:0;width:0;height:0;animation:unspin var(--T) linear infinite}
.p{position:absolute;color:var(--c);font-size:var(--z);line-height:1;text-shadow:0 0 12px var(--c);animation:pulse var(--b) ease-in-out infinite alternate;transform:translate(-50%,-50%)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes unspin{from{transform:rotate(calc(var(--a)*-1))}to{transform:rotate(calc(var(--a)*-1 - 360deg*var(--k)))}}
@keyframes pulse{from{transform:translate(-50%,-50%) scale(.8);opacity:.7}to{transform:translate(-50%,-50%) scale(1.3);opacity:1}}
.orbits{position:absolute;inset:0;opacity:0;animation:fadein 1.5s 2s forwards}
@keyframes fadein{to{opacity:1}}

.text{position:fixed;left:0;right:0;top:56%;text-align:center;padding:0 24px;pointer-events:none;z-index:1}
h1{font:italic 500 clamp(2rem,7vw,3.6rem)/1.1 'Fraunces',Georgia,serif;margin:0 0 .4rem;text-shadow:0 0 26px rgba(255,92,154,.7)}
h1 span{display:inline-block;opacity:0;animation:letter 1s cubic-bezier(.2,.9,.3,1) both}
@keyframes letter{from{opacity:0;transform:translateY(24px) scale(.6);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
#line{font-size:clamp(1.4rem,4.4vw,2rem);min-height:2.6em;color:#ffb3d1;transition:opacity .9s}
#hint{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));width:100%;text-align:center;font-size:1.2rem;opacity:0;animation:fadein 1.5s 5s forwards;pointer-events:none;z-index:1}

/* flowers */
.garden{position:fixed;left:0;right:0;bottom:0;height:0;z-index:2;pointer-events:none}
.flower{position:absolute;bottom:0;width:0;transform-origin:bottom center;animation:sway 5s ease-in-out var(--sd,0s) infinite alternate}
.stem{position:absolute;bottom:0;left:-1.5px;width:3px;height:var(--h);background:linear-gradient(var(--leaf),#2c5a48);border-radius:2px;transform-origin:bottom;animation:grow 1.8s cubic-bezier(.3,.7,.2,1) var(--d,0s) both}
.head{position:absolute;bottom:calc(var(--h) - var(--s)/2);left:calc(var(--s)/-2);width:var(--s);height:var(--s);cursor:pointer;pointer-events:auto;animation:rise 1.8s cubic-bezier(.3,.7,.2,1) var(--d,0s) both;filter:drop-shadow(0 0 10px #ff5c9a)}
.head svg{width:100%;height:100%;animation:spin 40s linear infinite}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes rise{from{transform:translateY(var(--h)) scale(0)}to{transform:translateY(0) scale(1)}}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}

/* letter modal */
#modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(28,15,31,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#modal.show{display:flex;animation:fadein .5s both;opacity:0}
#petals{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.pt{position:absolute;top:-24px;width:14px;height:18px;border-radius:150% 0 150% 0;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(720deg)}}
.stage{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:80vh}
.env{position:relative;width:min(300px,78vw);height:190px;perspective:900px;animation:drop .9s cubic-bezier(.2,1.3,.4,1) both;transition:opacity .7s,transform .8s}
@keyframes drop{from{opacity:0;transform:translateY(-120px) rotate(-8deg) scale(.7)}to{opacity:1;transform:none}}
.env.gone{opacity:0;transform:translateY(160px) scale(.8);pointer-events:none}
.back{position:absolute;inset:0;background:#d63a76;border-radius:8px;z-index:0;box-shadow:0 20px 50px rgba(255,46,126,.4)}
.paper{position:absolute;left:7%;right:7%;top:10px;bottom:14px;z-index:2;border-radius:6px;background:repeating-linear-gradient(#fff4f8 0 17px,#ffd9e6 17px 18px);transition:transform 1.1s cubic-bezier(.3,.8,.3,1) .7s}
.env.open .paper{transform:translateY(-78%)}
.pocket{position:absolute;inset:0;z-index:3;background:linear-gradient(#ff7fb0,#ff5c9a);border-radius:8px;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.flap{position:absolute;top:0;left:0;width:100%;height:106px;z-index:4;background:linear-gradient(#ff9ec7,#ff7fb0);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;backface-visibility:visible}
.env.open .flap{transform:rotateX(180deg);z-index:1;transition:transform .8s ease-in-out,z-index 0s .4s}
.seal{position:absolute;left:50%;top:76px;z-index:5;font-size:32px;color:#fff;text-shadow:0 0 14px #ff2e7e;transform:translateX(-50%);animation:beat 1.1s infinite}
@keyframes beat{50%{transform:translateX(-50%) scale(1.25)}}
.env.open .seal{animation:none;opacity:0;transform:translateX(-50%) scale(2.4);transition:all .45s}
.card{position:absolute;width:min(340px,88vw);max-height:74vh;overflow:auto;padding:26px 24px 22px;border-radius:14px;background:linear-gradient(160deg,#fff7fa,#ffdbe9);color:#7a1f48;box-shadow:0 20px 60px rgba(255,46,126,.4);opacity:0;pointer-events:none;perspective:800px}
.card.show{pointer-events:auto;animation:cardin 1s cubic-bezier(.2,1.2,.3,1) forwards}
@keyframes cardin{from{opacity:0;transform:translateY(120px) rotateX(50deg) scale(.6)}to{opacity:1;transform:none}}
#txt{font-size:1.6rem;line-height:1.35;margin:0;white-space:pre-wrap;min-height:6em}
.sig{text-align:right;font-size:1.7rem;font-weight:600;margin-top:12px;opacity:0;transition:opacity 1s}
.sig.on{opacity:1}
.ph{position:absolute;left:50%;top:50%;color:#ff5c9a;text-shadow:0 0 10px #ff2e7e;pointer-events:none;animation:up 1.9s ease-out forwards}
@keyframes up{from{opacity:1;transform:translate(0,0) scale(.4)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4)}}
#close{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer}
#music{position:fixed;z-index:11;top:calc(14px + env(safe-area-inset-top,0px));left:14px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,92,154,.25);color:#ffd1e3;font-size:20px;cursor:pointer;opacity:.7}
#music.on{opacity:1;background:#ff5c9a;color:#fff;animation:ring2 1.2s infinite}
@keyframes ring2{50%{box-shadow:0 0 0 8px rgba(255,92,154,.25)}}
#close:focus-visible,#music:focus-visible{outline:2px solid #fff}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}.ring circle{stroke-dashoffset:0}.orbits,#hint{opacity:1}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hero" id="hero"><div class="tilt" id="tilt"><div class="pop">
  <svg width="0" height="0" style="position:absolute"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd1e3"/><stop offset="1" stop-color="#ff3d8b"/></linearGradient></defs></svg>
  <svg class="ring dash" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48"/></svg>
  <svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48"/></svg>
  <div class="orbits" id="orbits"></div>
  <div class="photo" id="photo"><span class="initial">D</span><img id="pic" src="dea.jpg" alt="Dea" onerror="this.style.display='none'"></div>
</div></div></div>

<div class="text"><h1 id="title" aria-label="For you, Dea"></h1><div id="line"></div></div>
<div id="hint">tap a flower to open a letter 💌</div>
<div class="garden" id="garden"></div>

<audio id="song" src="your-universe.mp3" loop preload="auto"></audio>
<button id="music" aria-label="Play or pause music">♪</button>

<div id="modal" role="dialog" aria-label="Letter">
  <div id="petals"></div>
  <div class="stage" id="stage">
    <div class="env" id="env"><div class="back"></div><div class="paper"></div><div class="pocket"></div><div class="flap"></div><div class="seal">♥</div></div>
    <div class="card" id="card"><p id="txt"></p><div class="sig" id="sig"></div></div>
  </div>
  <button id="close" aria-label="Close letter">✕</button>
</div>

<script>
/* ✏️ EDIT THESE ✏️ */
const NAME = "Dea";
const FROM = "Kier";
const LINES = [
  "You make every ordinary day feel like spring.",
  "Every little moment with you is my favorite.",
  "Thank you for being my safe place.",
  "Still choosing you. Every single day."
];
// One letter per flower. They repeat if you plant more flowers.
const LETTERS = [
  "Dea,\n\nSome people walk into your life and quietly rearrange it. You did that to mine. There was no grand announcement, only a smile, and suddenly everything I thought I knew about happiness had to be rewritten.",
  "Dea,\n\nOn heavy days, I think of you the way a traveler thinks of home. You are the one place where the noise fades and I can finally breathe. Thank you for being that place for me.",
  "Dea,\n\nI have learned that love is not only the big moments. It lives in the small ones: your laugh before the joke ends, the way you say my name, a message that arrives right when I need it. I would keep every single one.",
  "Dea,\n\nIf my life were a book, you would not be a chapter. You would be the thread that runs through every page, the reason the story turned warm. I hope we keep writing it for a very long time.",
  "Dea,\n\nI am not perfect, but I am faithful. Whatever tomorrow looks like, I will choose you again, on the easy days and the hard ones, without needing a reason.",
  "Dea,\n\nThey say the universe is vast, but mine is surprisingly small. It fits in the space between your hand and mine. I love you, today and every day after."
];

const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
document.querySelector('.initial').textContent = NAME[0];

/* title: letters rise one by one */
const title = document.getElementById('title');
[...("For you, " + NAME)].forEach((ch,i) => {
  const s = document.createElement('span'); s.textContent = ch === ' ' ? '\u00a0' : ch;
  s.style.animationDelay = (2.2 + i*.07) + 's'; title.appendChild(s);
});

/* orbiting hearts: two rings going opposite ways */
function ring(T, k, n, r, size, colors, rev){
  const o = document.createElement('div'); o.className = 'orbit';
  o.style.cssText = `--T:${T}s;--k:${k};${rev ? 'animation-direction:reverse;' : ''}`;
  for(let i=0;i<n;i++){
    const h = document.createElement('div'); h.className = 'h';
    h.style.cssText = `--a:${i*360/n}deg;--r:calc(var(--ps)*${r})`;
    h.innerHTML = `<div class="u"><div class="p" style="--c:${colors[i%colors.length]};--z:${size*(.8+Math.random()*.6)}px;--b:${(0.9+Math.random()*.9).toFixed(2)}s">♥</div></div>`;
    o.appendChild(h);
  }
  document.getElementById('orbits').appendChild(o);
}
ring(24, 1, 8, .76, 22, ['#ff5c9a','#ff9ec7','#ffd1e3'], false);
ring(34, -1, 6, .98, 15, ['#ffb3d1','#ff7eb6'], true);

/* tilt photo with pointer */
const tilt = document.getElementById('tilt');
addEventListener('pointermove', e => {
  if(still) return;
  const dx = e.clientX/innerWidth - .5, dy = e.clientY/innerHeight - .5;
  tilt.style.transform = `rotateY(${dx*18}deg) rotateX(${-dy*18}deg)`;
});

/* ---------- Canvas: stars, shooting stars, floating hearts ---------- */
const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W, H; const dpr = Math.min(devicePixelRatio || 1, 2);
function resize(){ W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; cx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener('resize', resize); resize();
const stars = Array.from({length:90}, () => ({x:Math.random(), y:Math.random(), r:Math.random()*1.4+.3, p:Math.random()*6.28}));
const sparks = Array.from({length:22}, () => ({a:Math.random()*6.28, d:.62+Math.random()*.6, s:8+Math.random()*10, p:Math.random()*6.28}));
const floaters = [], shoot = []; let frame = 0;
function heroCenter(){ const r = document.getElementById('hero').getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2, r.width]; }
function burst(x,y,radial,n=9){
  for(let i=0;i<n;i++){
    const a = Math.random()*6.28, sp = radial ? 1.5+Math.random()*3.5 : 0;
    floaters.push(radial ? {x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,s:10+Math.random()*16,a:1,f:.012}
                         : {x,y,vx:(Math.random()-.5)*2.4,vy:-1-Math.random()*2.2,s:10+Math.random()*16,a:1,f:.0035});
  }
}
function draw(){
  frame++; cx.clearRect(0,0,W,H);
  for(const s of stars){ cx.globalAlpha = .35+.65*Math.abs(Math.sin(frame*.015+s.p)); cx.fillStyle = '#ffe3ef'; cx.beginPath(); cx.arc(s.x*W,s.y*H,s.r,0,6.28); cx.fill(); }
  if(!still && frame%260===0) shoot.push({x:Math.random()*W*.8,y:Math.random()*H*.3,vx:7,vy:3.2,l:1});
  for(let i=shoot.length-1;i>=0;i--){
    const s = shoot[i]; s.x += s.vx; s.y += s.vy; s.l -= .018;
    if(s.l<=0){ shoot.splice(i,1); continue; }
    const g = cx.createLinearGradient(s.x,s.y,s.x-s.vx*10,s.y-s.vy*10);
    g.addColorStop(0,`rgba(255,220,235,${s.l})`); g.addColorStop(1,'rgba(255,220,235,0)');
    cx.globalAlpha = 1; cx.strokeStyle = g; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(s.x,s.y); cx.lineTo(s.x-s.vx*10,s.y-s.vy*10); cx.stroke();
  }
  const [hx,hy,hw] = heroCenter();
  cx.fillStyle = '#ffd1e3'; cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for(const s of sparks){
    const a = s.a + frame*.003, rr = hw*s.d;
    cx.globalAlpha = Math.max(0, Math.sin(frame*.05+s.p))*.9; cx.font = s.s+'px serif';
    cx.fillText('✦', hx+Math.cos(a)*rr, hy+Math.sin(a)*rr);
  }
  if(frame%38===0) floaters.push({x:Math.random()*W,y:H+10,vx:(Math.random()-.5)*.5,vy:-.7-Math.random()*.9,s:8+Math.random()*14,a:.7,f:.0035});
  for(let i=floaters.length-1;i>=0;i--){
    const f = floaters[i]; f.x += f.vx+Math.sin(frame*.03+i)*.2; f.y += f.vy; f.vx *= f.f>.01?.985:1; f.vy *= f.f>.01?.985:1; f.a -= f.f;
    if(f.a<=0||f.y<-20){ floaters.splice(i,1); continue; }
    cx.globalAlpha = f.a; cx.fillStyle = '#ff7eb6'; cx.font = f.s+'px serif'; cx.fillText('♥',f.x,f.y);
  }
  cx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
draw();
setTimeout(() => { const [x,y] = heroCenter(); burst(x,y,true,28); }, 1300);
setTimeout(() => { const [x,y] = heroCenter(); burst(x,y,true,18); }, 3000);

/* ---------- Pink flowers ---------- */
const PINKS = ['#ff5c9a','#ff7eb6','#ff9ec7','#ff4d94','#f78fb3','#ffb3d1'];
const garden = document.getElementById('garden');
let count = 0;
function plant(x, delay){
  const c = PINKS[Math.random()*PINKS.length|0], idx = count++;
  const h = 60 + Math.random()*Math.min(120, H*.16), s = 44 + Math.random()*32;
  let outer = '', inner = '';
  for(let i=0;i<8;i++) outer += `<ellipse cx="0" cy="-22" rx="11" ry="23" fill="${c}" transform="rotate(${i*45})"/>`;
  for(let i=0;i<8;i++) inner += `<ellipse cx="0" cy="-13" rx="7" ry="14" fill="#ffd9e8" opacity=".75" transform="rotate(${i*45+22})"/>`;
  const f = document.createElement('div'); f.className = 'flower';
  f.style.cssText = `left:${x}px;--h:${h}px;--s:${s}px;--d:${delay}s;--sd:${-Math.random()*4}s`;
  f.innerHTML = `<div class="stem"></div><div class="head"><svg viewBox="-50 -50 100 100">${outer}${inner}<circle r="6" fill="#fff0f6"/><circle r="2.5" fill="#ff8fb8"/></svg></div>`;
  f.querySelector('.head').addEventListener('pointerdown', e => { e.stopPropagation(); openLetter(idx); });
  garden.appendChild(f);
}
const n = Math.max(5, Math.round(W/80));
for(let i=0;i<n;i++) plant((i+.5)*W/n+(Math.random()-.5)*30, 2.6+Math.random()*2.4);

const modal = document.getElementById('modal');
addEventListener('pointerdown', e => {
  if(modal.classList.contains('show') || e.target.closest('#music')) return;
  if(e.target.closest('#hero')){ const [x,y] = heroCenter(); burst(x,y,true,22); return; }
  plant(e.clientX, 0); burst(e.clientX, e.clientY, false);
});

/* ---------- Letter ---------- */
const env = document.getElementById('env'), card = document.getElementById('card'), stage = document.getElementById('stage'),
      txt = document.getElementById('txt'), sig = document.getElementById('sig'), petals = document.getElementById('petals');
let token = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));
function popHearts(){
  for(let k=0;k<16;k++){
    const p = document.createElement('i'); p.className = 'ph'; p.textContent = '♥';
    p.style.cssText = `--dx:${(Math.random()-.5)*340}px;--dy:${-80-Math.random()*220}px;font-size:${12+Math.random()*16}px;animation-delay:${Math.random()*.3}s`;
    stage.appendChild(p); setTimeout(() => p.remove(), 2400);
  }
}
function openLetter(i){
  const my = ++token, body = LETTERS[i % LETTERS.length];
  modal.classList.add('show');
  env.className = 'env'; void env.offsetWidth; card.className = 'card';
  txt.textContent = ''; sig.className = 'sig'; sig.textContent = '— ' + FROM; petals.innerHTML = '';
  for(let k=0;k<22;k++){
    const p = document.createElement('i'); p.className = 'pt';
    p.style.cssText = `left:${Math.random()*100}%;--x:${(Math.random()-.5)*160}px;animation-duration:${5+Math.random()*5}s;animation-delay:${-Math.random()*8}s;background:${PINKS[k%PINKS.length]}`;
    petals.appendChild(p);
  }
  (async () => {
    await wait(still ? 0 : 1300); if(my!==token) return; env.classList.add('open');
    await wait(still ? 0 : 2300); if(my!==token) return; popHearts(); env.classList.add('gone'); card.classList.add('show');
    await wait(still ? 0 : 800);
    for(let k=1;k<=body.length;k++){ if(my!==token) return; txt.textContent = body.slice(0,k); if(!still) await wait(body[k-1]==='\n'?250:28); }
    sig.classList.add('on');
  })();
}
function closeLetter(){ token++; modal.classList.remove('show'); petals.innerHTML = ''; }
document.getElementById('close').addEventListener('click', closeLetter);
modal.addEventListener('pointerdown', e => { if(e.target === modal || e.target === stage) closeLetter(); });
addEventListener('keydown', e => { if(e.key==='Escape') closeLetter(); });

/* ---------- Music ---------- */
// Put your mp3 beside index.html and name it your-universe.mp3
const song = document.getElementById('song'), mbtn = document.getElementById('music');
let wantMusic = true; song.volume = .75;
const sync = () => mbtn.classList.toggle('on', !song.paused);
addEventListener('pointerdown', e => { if(!e.target.closest('#music') && wantMusic && song.paused) song.play().then(sync).catch(()=>{}); });
mbtn.addEventListener('click', () => {
  if(song.paused){ wantMusic = true; song.play().then(sync).catch(()=>{}); }
  else { wantMusic = false; song.pause(); sync(); }
});

/* ---------- Rotating lines ---------- */
const line = document.getElementById('line'); let li = 0;
function nextLine(){ line.style.opacity = 0; setTimeout(() => { line.textContent = LINES[li++ % LINES.length]; line.style.opacity = 1; }, 900); }
setTimeout(() => { nextLine(); setInterval(nextLine, 5200); }, 3800);
</script>
