<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you 🌹</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c0f1f;--bg2:#3a1630;--rose:#ff5c8a;--blush:#ffd6e0;--gold:#f6c177;--leaf:#5fa383;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 30%,var(--bg2),var(--bg) 70%);color:var(--blush);font-family:'Caveat',cursive;-webkit-tap-highlight-color:transparent;cursor:pointer;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.text{position:fixed;left:0;right:0;top:56%;text-align:center;padding:0 24px;pointer-events:none}
h1{font:italic 500 clamp(2rem,7vw,3.8rem)/1.1 'Fraunces',Georgia,serif;margin:0 0 .5rem;opacity:0;animation:in 2s 1.6s forwards;text-shadow:0 0 24px rgba(255,92,138,.55)}
#line{font-size:clamp(1.4rem,4.4vw,2rem);min-height:2.6em;color:var(--gold);transition:opacity .9s}
#hint{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));width:100%;text-align:center;font-size:1.15rem;opacity:0;animation:in 1.5s 5s forwards;color:var(--blush);pointer-events:none}
.garden{position:fixed;left:0;right:0;bottom:0;height:0;pointer-events:none}
.flower{position:absolute;bottom:0;width:0;transform-origin:bottom center;animation:sway 5s ease-in-out var(--sd,0s) infinite alternate}
.stem{position:absolute;bottom:0;left:-1.5px;width:3px;height:var(--h);background:linear-gradient(var(--leaf),#2c5a48);border-radius:2px;transform-origin:bottom;animation:grow 1.8s cubic-bezier(.3,.7,.2,1) var(--d,0s) both}
.head{position:absolute;bottom:calc(var(--h) - var(--s)/2);left:calc(var(--s)/-2);width:var(--s);height:var(--s);animation:rise 1.8s cubic-bezier(.3,.7,.2,1) var(--d,0s) both;filter:drop-shadow(0 0 10px var(--c))}
.head svg{width:100%;height:100%;animation:spin 40s linear infinite}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes rise{from{transform:translateY(var(--h)) scale(0)}to{transform:translateY(0) scale(1)}}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes in{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.stem,.head,.flower,.head svg{animation:none}h1,#hint{animation:none;opacity:1}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="text">
  <h1 id="title"></h1>
  <div id="line"></div>
</div>
<div id="hint">tap anywhere to plant a flower</div>
<div class="garden" id="garden"></div>

<script>
/* ✏️ EDIT THESE ✏️ */
const NAME = "my love";
const LINES = [
  "You make my ordinary days feel like spring.",
  "Every little moment with you is my favorite.",
  "I grow a little more every time you smile.",
  "Thank you for being my safe place.",
  "Still choosing you. Every single day."
];

document.getElementById('title').textContent = "For you, " + NAME;

const cv = document.getElementById('c'), cx = cv.getContext('2d');
let W, H, dpr = Math.min(devicePixelRatio || 1, 2);
const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
function resize(){ W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; cx.setTransform(dpr,0,0,dpr,0,0); }
addEventListener('resize', resize); resize();

// Heart shape (classic parametric curve), points in unit space
function heartPt(t){ return [16*Math.pow(Math.sin(t),3), -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]; }
const P = [];
const N = innerWidth < 600 ? 650 : 1100;
for(let i=0;i<N;i++){
  const [hx,hy] = heartPt(Math.random()*Math.PI*2);
  const k = Math.random() < .55 ? 1 - Math.random()*.06 : Math.sqrt(Math.random()); // edge vs fill
  const a = Math.random()*Math.PI*2, r = Math.max(W,H)*(.6+Math.random()*.5);
  P.push({ hx:hx*k, hy:hy*k, x:W/2+Math.cos(a)*r, y:H/2+Math.sin(a)*r, s:Math.random()*1.8+.7,
           hue:335+Math.random()*30, p:Math.random()*6.28, d:Math.random()*60|0 });
}
const floaters = [];
let frame = 0;

function burst(x, y){
  for(let i=0;i<9;i++) floaters.push({ x, y, vx:(Math.random()-.5)*2.4, vy:-1-Math.random()*2.2, s:10+Math.random()*16, a:1, g:'♥' });
}

function draw(){
  frame++;
  cx.clearRect(0,0,W,H);
  const scale = Math.min(W*.82, H*.46) / 34;
  const ox = W/2, oy = H*.3;
  const beatT = (frame % 100) / 100; // double thump
  const beat = 1 + .05*Math.exp(-Math.pow((beatT-.08)*14,2)) + .035*Math.exp(-Math.pow((beatT-.28)*14,2));
  cx.globalCompositeOperation = 'lighter';
  for(const p of P){
    const tx = ox + p.hx*scale*beat + Math.sin(frame*.02+p.p)*1.2;
    const ty = oy + p.hy*scale*beat + Math.cos(frame*.02+p.p)*1.2;
    const ease = still ? 1 : (frame > p.d ? .045 : 0);
    p.x += (tx-p.x)*(still?1:ease); p.y += (ty-p.y)*(still?1:ease);
    cx.fillStyle = `hsla(${p.hue},95%,${62+Math.sin(frame*.05+p.p)*12}%,.8)`;
    cx.beginPath(); cx.arc(p.x, p.y, p.s*(.8+beat-1+.2), 0, 6.283); cx.fill();
  }
  cx.globalCompositeOperation = 'source-over';
  if(frame % 38 === 0) floaters.push({ x:Math.random()*W, y:H+10, vx:(Math.random()-.5)*.5, vy:-.7-Math.random()*.9, s:8+Math.random()*14, a:.7, g:'♥' });
  for(let i=floaters.length-1;i>=0;i--){
    const f = floaters[i]; f.x += f.vx + Math.sin(frame*.03+i)*.3; f.y += f.vy; f.a -= .0035;
    if(f.a <= 0 || f.y < -20){ floaters.splice(i,1); continue; }
    cx.globalAlpha = f.a; cx.fillStyle = '#ff7aa2'; cx.font = f.s+'px serif'; cx.fillText(f.g, f.x, f.y);
  }
  cx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
draw();

// Flowers
const COLORS = ['#ff5c8a','#ff8fab','#ffd6e0','#f6c177','#c77dff','#ff9770'];
const garden = document.getElementById('garden');
function plant(x, delay){
  const c = COLORS[Math.random()*COLORS.length|0];
  const h = 70 + Math.random()*Math.min(150, H*.2), s = 42 + Math.random()*34;
  let petals = '';
  for(let i=0;i<8;i++) petals += `<ellipse cx="0" cy="-21" rx="10" ry="22" fill="${c}" opacity=".88" transform="rotate(${i*45})"/>`;
  const f = document.createElement('div');
  f.className = 'flower';
  f.style.cssText = `left:${x}px;--h:${h}px;--s:${s}px;--c:${c};--d:${delay}s;--sd:${-Math.random()*4}s`;
  f.innerHTML = `<div class="stem"></div><div class="head"><svg viewBox="-50 -50 100 100">${petals}<circle r="9" fill="#f6c177"/><circle r="4" fill="#c9852e"/></svg></div>`;
  garden.appendChild(f);
  if(garden.children.length > 60) garden.firstChild.remove();
}
const count = Math.round(W/70);
for(let i=0;i<count;i++) plant((i+.5)*W/count + (Math.random()-.5)*30, 2.2 + Math.random()*2.6);

addEventListener('pointerdown', e => {
  plant(e.clientX, 0);
  burst(e.clientX, e.clientY);
});

// Rotating messages
const line = document.getElementById('line');
let li = 0;
function nextLine(){
  line.style.opacity = 0;
  setTimeout(() => { line.textContent = LINES[li++ % LINES.length]; line.style.opacity = 1; }, 900);
}
setTimeout(() => { nextLine(); setInterval(nextLine, 5200); }, 3000);
</script>
</body>
</html>
